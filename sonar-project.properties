# Copia estos dos valores desde SonarCloud (Information del proyecto)
sonar.organization=CAMBIAR_POR_TU_ORGANIZACION
sonar.projectKey=CAMBIAR_POR_TU_PROJECT_KEY

sonar.sources=backend,frontend
sonar.exclusions=**/migrations/**,**/staticfiles/**,**/static/lib/**,**/media/**,**/*.min.css,**/*.min.js
sonar.tests=backend/tienda/tests.py
sonar.test.inclusions=backend/tienda/tests.py
sonar.python.version=3.12
sonar.python.coverage.reportPaths=backend/coverage.xml
# Hace que el job falle si no pasa el Quality Gate
sonar.qualitygate.wait=true
